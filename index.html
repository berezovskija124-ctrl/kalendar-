<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мои смены</title>
<meta name="description" content="Рабочий календарь: смены, время работы, выходные, праздники России и заметки.">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мои смены">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Макет: табель на весь экран. Сетка месяца тянется по высоте, под ней итог и одна строка действий; всё остальное открывается шторкой снизу. */
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface-2: #f3f5f8; --ink: #18202b; --muted: #5a6675; --line: #d8dee6;
  --red: #cf1f3a; --red-soft: #fce8eb; --red-mid: #f8cdd4; --on-red: #ffffff; --red-fixed: #cf1f3a;
  --orange: #bd5a00; --orange-soft: #fdeedb; --orange-mid: #f9d7ae;
  --on-shift: #ffffff;
  --s1: #2a67cf; --s2: #6a4bc8; --s3: #0f7f73; --s4: #3a8236; --s5: #667386; --s6: #94489f;
  --s7: #0b779f; --s8: #7a682a; --s9: #c2417f; --s10: #c8323f; --s11: #c4620a; --s12: #7d5236;
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --orange-mid: #5c3d17;
    --bg: #11151b; --surface: #1a2028; --surface-2: #232a34; --ink: #e9edf2; --muted: #9ca8b6; --line: #2f3843;
    --red: #ff7385; --red-soft: #351b21; --red-mid: #58242e; --on-red: #2a0a10;
    --orange: #ffa95a; --orange-soft: #352412;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --orange-mid: #5c3d17;
  --bg: #11151b; --surface: #1a2028; --surface-2: #232a34; --ink: #e9edf2; --muted: #9ca8b6; --line: #2f3843;
  --red: #ff7385; --red-soft: #351b21; --red-mid: #58242e; --on-red: #2a0a10;
  --orange: #ffa95a; --orange-soft: #352412;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--font-body); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; transition: transform .12s ease-out, opacity .12s ease-out; }
button:active { transform: scale(.92); opacity: .85; }
.cell:active, .note-row:active { transform: scale(.97); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { height: 100%; width: 100%; max-width: 480px; margin-inline: auto; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.pane { min-width: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.cal-pane { display: flex; flex-direction: column; padding-block: 6px 12px; }
.notes-pane { position: relative; display: flex; flex-direction: column; padding-block: 8px 12px; }
.app[data-view="cal"] .notes-pane, .app[data-view="notes"] .cal-pane { display: none; }
.cal-inner { flex: 1 0 auto; width: 100%; max-width: 980px; margin-inline: auto; display: flex; flex-direction: column; gap: 10px; }

/* Шапка месяца */
.top { display: flex; align-items: center; gap: 4px; }
.month { margin: 0; flex: 1 1 auto; min-width: 0; font: 600 clamp(20px, 5.6vw, 28px)/1.15 var(--font-display); letter-spacing: -.01em; }
.month small { font-size: .6em; font-weight: 500; color: var(--muted); margin-left: .3em; }
.icon-btn { width: 42px; height: 42px; display: inline-grid; place-items: center; border-radius: 12px; color: var(--ink); flex: none; }
.text-btn { height: 42px; padding-inline: 10px; border-radius: 12px; font-weight: 500; }
.next { margin: -6px 0 0; color: var(--muted); font-size: 14px; }
.next b { color: var(--ink); font-weight: 600; }

/* Сетка */
.sheet { flex: 1 1 auto; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--line); }
.dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; }
.dow { padding-bottom: 1px; flex: none; }
.dow span { background: var(--surface-2); text-align: center; padding: 5px 0; font-size: 12px; font-weight: 600; letter-spacing: .03em; color: var(--muted); }
.dow .off { color: var(--red); background: var(--red-soft); }
.dow .sun { color: var(--orange); background: var(--orange-soft); }
.grid { flex: 1 1 auto; grid-auto-rows: minmax(57px, 1fr); }
.cell { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 0; padding: 4px 2px 3px; background: var(--surface); font-variant-numeric: tabular-nums; overflow: hidden; }
.cell:focus-visible { outline-offset: -3px; }
.cell.off { background: var(--red-soft); }
.cell.sun { background: var(--orange-soft); }
.cell.hol { background: var(--red-mid); }
.cell.out > * { opacity: .36; }
.fill { position: absolute; inset: 3px; border-radius: 10px; }
.cell.marked.off, .cell.marked.hol { background: var(--red-mid); }
.cell.marked.sun { background: var(--orange-mid); }
.cell.marked.off .fill, .cell.marked.sun .fill, .cell.marked.hol .fill { inset: 4px; }
.num, .code-t, .time-t { position: relative; z-index: 1; }
.num { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; font-weight: 500; font-size: 15px; }
.cell.off .num { color: var(--red); font-weight: 600; }
.cell.sun .num { color: var(--orange); font-weight: 600; }
.cell.hol .num { background: var(--red); color: var(--on-red); font-weight: 700; }
.cell.today .num { box-shadow: 0 0 0 2px var(--ink); }
.cell.sel { box-shadow: inset 0 0 0 2px var(--ink); }
.cell.marked { padding-bottom: 5px; }
.cell.marked .num { height: 22px; color: var(--on-shift); font-weight: 700; }
.cell.marked.hol .num { background: var(--on-shift); color: var(--red-fixed); }
.cell.marked.today .num { box-shadow: 0 0 0 2px var(--on-shift); }
.code-t { margin-top: auto; max-width: 100%; padding-inline: 4px; font-size: 12px; font-weight: 700; line-height: 1.15; color: var(--on-shift); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.time-t { max-width: 100%; padding-inline: 4px; font-size: 10px; font-weight: 600; line-height: 1.15; color: var(--on-shift); white-space: nowrap; overflow: hidden; }
.dot { position: absolute; z-index: 1; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.cell.marked .dot { background: var(--on-shift); }
.painting .cell { cursor: copy; }

/* Итог месяца */
.totals { flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding-block: 6px; }
.totals div { text-align: center; min-width: 0; border-left: 1px solid var(--line); }
.totals div:first-child { border-left: 0; }
.totals b { display: block; font-size: 17px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.totals small { display: block; font-size: 11.5px; line-height: 1.2; color: var(--muted); white-space: nowrap; }
.totals .t-off b, .totals .t-off small, .totals .t-hol b, .totals .t-hol small { color: var(--red); }
.totals .t-sun b, .totals .t-sun small { color: var(--orange); }

/* Действия */
.actions { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; }
.btn { min-height: 46px; padding: 8px 16px; border-radius: 13px; background: var(--ink); color: var(--bg); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.square { width: 46px; padding: 0; }
.actions .btn { padding-inline: 12px; white-space: nowrap; }
.paint { flex: none; display: flex; flex-direction: column; gap: 8px; }
.paint-row { display: flex; align-items: center; gap: 8px; }
.scroll-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 0; padding-block: 2px; }
.scroll-row::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 5px 12px 5px 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 500; }
.chip .code { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: var(--on-shift); font-size: 13px; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.sync-bad { margin: 0; font-size: 13px; color: var(--red); }

/* Цвета */
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatches.scroll-row { flex-wrap: nowrap; padding: 5px; margin: -3px; }
.sw { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--on-shift); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.sw.none { background: var(--surface-2); color: var(--muted); border: 1.5px dashed var(--muted); }
.sw svg.i { width: 18px; height: 18px; stroke-width: 2.6; }
.swatches.tiny .sw { width: 34px; height: 34px; }

/* Шторки */
dialog, .sheet-ghost { position: fixed; inset: auto 0 0 0; margin: auto auto 0; width: 100%; max-width: 480px; max-height: 88dvh; border: 0; border-radius: 22px 22px 0 0; padding: 0; background: var(--surface); color: var(--ink); overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; }
dialog::backdrop { background: rgba(10, 14, 20, .55); }
dialog[open] { animation: sheet-up .36s cubic-bezier(.2, .85, .25, 1); }
dialog[open]::backdrop { animation: shade-in .3s ease-out; }
.sheet-ghost { z-index: 41; overflow: hidden; pointer-events: none; }
.sheet-shade { position: fixed; inset: 0; z-index: 40; background: rgba(10, 14, 20, .55); pointer-events: none; }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes shade-in { from { opacity: 0; } to { opacity: 1; } }
.dlg { display: flex; flex-direction: column; gap: 16px; padding: 8px var(--gutter-r) 0 var(--gutter-l); }
.grip { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 2px auto 0; flex: none; }
.dlg-head { display: flex; align-items: center; gap: 2px; }
.dlg-head > div { flex: 1 1 auto; min-width: 0; text-align: center; }
.dlg h2 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; text-wrap: balance; }
.badge { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
.badge.off, .badge.hol { color: var(--red); } .badge.sun { color: var(--orange); }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 24px; }
.label { margin: 0; font-size: 14px; font-weight: 700; }
.shift-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opt { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); text-align: left; min-width: 0; }
.opt .code { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--on-shift); font-weight: 700; }
.opt .tx { min-width: 0; line-height: 1.2; }
.opt .tx b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt .tx small { color: var(--muted); font-size: 12.5px; }
.opt[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--surface); }
.opt.add { justify-content: center; color: var(--muted); font-weight: 600; border-style: dashed; background: none; }
.time-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.time-field { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; height: 52px; padding-inline: 14px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); }
.time-field:focus-within { border-color: var(--ink); }
.tf-lbl { font-size: 14px; color: var(--muted); }
.tf-val { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tf-val.empty { color: var(--muted); font-weight: 500; }
.time-field input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; margin: 0; font-size: 16px; }
.time-sum { margin: 0; font-size: 15px; color: var(--muted); }
.time-sum b { color: var(--ink); font-size: 17px; font-weight: 700; }
.time-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.time-actions:empty { display: none; }
.mini { min-height: 38px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 13.5px; font-weight: 600; }
.time-note { flex: 1 0 100%; margin: 0; font-size: 12.5px; color: var(--muted); }
input[type="time"] { -webkit-appearance: none; appearance: none; text-align: left; }
input[type="time"]::-webkit-date-and-time-value { text-align: left; }
.scope { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 11px; background: var(--surface-2); }
.scope button { min-height: 36px; padding-inline: 6px; border-radius: 9px; font-size: 13.5px; font-weight: 500; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scope button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.dlg-actions { position: sticky; bottom: 0; z-index: 1; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; padding-block: 8px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); }
.linkish { font-size: 14px; font-weight: 600; color: var(--muted); padding: 2px 0; }
.small { margin: 0; font-size: 13px; color: var(--muted); }
.small.bad { color: var(--red); }

.field { display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; font-weight: 500; color: var(--muted); min-width: 0; }
.field select, .field input { height: 44px; padding-inline: 10px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); color: var(--ink); font-size: 16px; width: 100%; min-width: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.patterns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.patterns button { min-height: 54px; padding: 6px; border: 1px solid var(--line); border-radius: 12px; font-weight: 700; line-height: 1.15; }
.patterns small { display: block; font-size: 12px; font-weight: 500; opacity: .75; }
.patterns button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.strip span { display: grid; place-items: center; height: 34px; border-radius: 8px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.strip span:not(.on) { background: var(--surface-2); color: var(--muted); }
.strip .on { color: var(--on-shift); }
.type-card { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.type-row { display: grid; grid-template-columns: 40px 48px minmax(0, 1fr) 36px; gap: 6px; align-items: center; }
.type-times { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 78px; gap: 6px; align-items: end; }
.type-times .time-field { height: 44px; padding-inline: 8px; gap: 4px; }
.type-times .tf-val { font-size: 16px; }
.type-times .tf-lbl { font-size: 13px; }
.type-sum { margin: 0; font-size: 13px; color: var(--muted); }
.type-sum b { color: var(--ink); }
.type-times input[readonly] { color: var(--muted); }
.type-times > label:not(.time-field) { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
.type-times input { height: 42px; padding-inline: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); font-size: 16px; width: 100%; min-width: 0; }
.type-row input { height: 42px; padding-inline: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-size: 16px; width: 100%; min-width: 0; }
.type-row .pick { width: 40px; height: 40px; border-radius: 50%; }

/* Заметки */
.list-view, .edit-view { display: flex; flex-direction: column; flex: 1 0 auto; gap: 10px; }
.notes-title { margin: 0; display: flex; align-items: baseline; gap: 8px; font: 600 clamp(22px, 6vw, 26px)/1.2 var(--font-display); letter-spacing: -.01em; }
.notes-title small { font: 500 14px var(--font-body); color: var(--muted); letter-spacing: 0; }
.search { width: 100%; height: 42px; padding-inline: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
.groups { display: flex; flex-direction: column; gap: 14px; }
.group { display: flex; flex-direction: column; gap: 6px; }
.group h3 { margin: 0; font-size: 14px; font-weight: 700; }
.rows { background: var(--surface); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.dlg .rows { background: var(--surface-2); }
.note-row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 62px; padding: 9px 14px; text-align: left; border-top: 1px solid var(--line); }
.note-row:first-child { border-top: 0; }
.note-row:focus-visible { outline-offset: -2px; }
.ndot { flex: none; width: 12px; height: 12px; border-radius: 50%; }
.note-row .body { flex: 1 1 auto; min-width: 0; }
.note-row b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-row .m { display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; color: var(--muted); min-width: 0; }
.note-row .m time { flex: none; color: var(--ink); opacity: .75; }
.note-row .m span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.note-row .to { display: block; margin-top: 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
.empty { margin: 0; padding: 16px 14px; color: var(--muted); }
.compose { position: sticky; bottom: 4px; margin-top: auto; align-self: flex-end; min-height: 48px; padding: 8px 18px 8px 14px; border-radius: 24px; background: var(--ink); color: var(--bg); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }

.edit-view.leaving { position: absolute; inset: 0; z-index: 5; background: var(--bg); overflow: hidden; padding: 8px var(--gutter-r) 12px var(--gutter-l); box-shadow: -8px 0 24px rgba(0, 0, 0, .18); }
.edit-head { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; flex-direction: column; gap: 2px; margin-top: -8px; padding-top: 8px; border-bottom: 1px solid var(--line); }
.edit-bar { display: flex; align-items: center; gap: 2px; }
.edit-bar .back { display: inline-flex; align-items: center; gap: 2px; height: 44px; padding-right: 8px; font-weight: 500; border-radius: 12px; margin-right: auto; }
.edit-bar .done { font-weight: 700; height: 44px; padding-inline: 10px; }
.icon-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tools { display: flex; align-items: center; justify-content: space-between; gap: 2px; padding-bottom: 4px; }
.tools button { flex: 1 1 0; height: 44px; border-radius: 11px; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; }
.tools button[aria-expanded="true"] { background: var(--surface); }
.tool-dot { width: 20px; height: 20px; border-radius: 50%; border: 1.8px solid var(--muted); }
.tool-dot.set { border: 0; }
.panel { display: flex; align-items: center; gap: 8px; padding-block: 6px 8px; flex-wrap: wrap; }
.panel input { height: 42px; flex: 1 1 150px; min-width: 0; padding-inline: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 16px; }
.stamp { margin: 0; text-align: center; font-size: 12.5px; color: var(--muted); }
.editor { flex: 1 1 auto; min-height: 45dvh; outline: none; font-size: 17px; line-height: 1.45; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.editor > :first-child { font-size: 1.32em; font-weight: 700; line-height: 1.25; margin-bottom: .2em; }
.editor.blank > :first-child::before { content: "Новая заметка"; color: var(--muted); font-weight: 600; }
.editor ul, .editor ol { margin: .2em 0; padding-left: 1.4em; }
.editor p { margin: 0; }
.editor .check { position: relative; padding-left: 34px; min-height: 1.6em; padding-block: 2px; font-size: 17px; font-weight: 400; line-height: 1.45; }
.editor .check { transition: color .2s; }
.editor .check::before { content: ""; position: absolute; left: 2px; top: .2em; width: 22px; height: 22px; border-radius: 50%; border: 1.8px solid var(--muted); cursor: pointer; transition: background-color .2s, border-color .2s, box-shadow .2s; }
.editor .check[data-done="1"] { color: var(--muted); text-decoration: line-through; }
.editor .check[data-done="1"]::before { background: var(--ink); border-color: var(--ink); box-shadow: inset 0 0 0 4px var(--bg); }

/* Вкладки */
.tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); background: var(--bg); padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.tab-pill { position: absolute; top: 5px; bottom: 5px; left: var(--gutter-l); width: calc((100% - var(--gutter-l) - var(--gutter-r)) / 2); border-radius: 12px; background: var(--surface); transition: transform .32s cubic-bezier(.2, .85, .25, 1); }
.app[data-view="notes"] .tab-pill { transform: translateX(100%); }
.tabs button { position: relative; transition: transform .12s ease-out, color .2s; display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); }
.app.editing .tabs { display: none; }

.toast { position: fixed; z-index: 20; left: var(--gutter-l); right: var(--gutter-r); bottom: calc(62px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; max-width: 420px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 10px 10px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); }
.toast button { font-weight: 700; padding: 6px 8px; color: inherit; text-decoration: underline; }

@media (prefers-reduced-motion: reduce) {
  button, .tab-pill, .editor .check, .editor .check::before { transition: none; }
  button:active, .cell:active, .note-row:active { transform: none; }
  dialog[open], dialog[open]::backdrop { animation: none; }
}
/* Цвета смен: стоят последними, чтобы перекрывать базовый фон */
.c1 { background: var(--s1); } .c2 { background: var(--s2); } .c3 { background: var(--s3); } .c4 { background: var(--s4); }
.c5 { background: var(--s5); } .c6 { background: var(--s6); } .c7 { background: var(--s7); } .c8 { background: var(--s8); }
.c9 { background: var(--s9); } .c10 { background: var(--s10); } .c11 { background: var(--s11); } .c12 { background: var(--s12); }

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const REDUCE = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const EASE = 'cubic-bezier(.2, .85, .25, 1)';
  const anim = (el, kf, opt) => (!el || !el.animate || REDUCE.matches) ? null : el.animate(kf, opt);
  const pop = (el, from) => anim(el, [{ transform: 'scale(' + (from || .88) + ')' }, { transform: 'scale(1.06)', offset: .55 }, { transform: 'scale(1)' }], { duration: 280, easing: 'ease-out' });
  const rise = el => anim(el, [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: EASE });
  const staggerIn = (els, y) => [...els].slice(0, 12).forEach((el, i) => anim(el, [{ opacity: 0, transform: 'translateY(' + (y || 14) + 'px)' }, { opacity: 1, transform: 'none' }], { duration: 300, delay: 50 + i * 32, easing: EASE, fill: 'backwards' }));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const WEEK = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
  const WEEK_S = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  /* Порядок в палитре идёт по оттенкам */
  const COLORS = [[10, 'красный'], [11, 'оранжевый'], [8, 'оливковый'], [4, 'зелёный'], [3, 'бирюзовый'], [7, 'голубой'], [1, 'синий'], [2, 'фиолетовый'], [6, 'лиловый'], [9, 'розовый'], [12, 'коричневый'], [5, 'серый']];
  const DEFAULT_TYPES = [
    { id: 'day', code: 'Д', name: 'День', hours: 12, color: 1, from: '08:00', to: '20:00' },
    { id: 'night', code: 'Н', name: 'Ночь', hours: 12, color: 2, from: '20:00', to: '08:00' },
    { id: 'full', code: 'С', name: 'Сутки', hours: 24, color: 3, from: '08:00', to: '08:00' },
    { id: 'vac', code: 'О', name: 'Отпуск', hours: 0, color: 4 },
    { id: 'sick', code: 'Б', name: 'Больничный', hours: 0, color: 5 }
  ];
  const col = n => { n = Math.round(Number(n)); return n >= 1 && n <= 12 ? n : 1; };
  const TICK = '<svg class="i"><use href="#i-tick"/></svg>';
  const X = '<svg class="i"><use href="#i-x"/></svg>';

  /* Даты */
  const pad = n => String(n).padStart(2, '0');
  const keyOf = (y, m, d) => y + '-' + pad(m + 1) + '-' + pad(d);
  const keyOfDate = dt => keyOf(dt.getFullYear(), dt.getMonth(), dt.getDate());
  const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const dayIndex = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
  const addDays = (k, n) => { const dt = parseKey(k); dt.setDate(dt.getDate() + n); return keyOfDate(dt); };
  const todayKey = () => keyOfDate(new Date());
  const plural = (n, a, b, c) => { const t = n % 100, u = n % 10; return (t > 10 && t < 20) ? c : u === 1 ? a : (u >= 2 && u <= 4) ? b : c; };
  const dayTitle = k => { const dt = parseKey(k); return dt.getDate() + ' ' + MONTHS_GEN[dt.getMonth()]; };

  /* Нерабочие праздничные дни по ст. 112 ТК РФ */
  function holidayName(k) {
    const m = +k.slice(5, 7), d = +k.slice(8, 10);
    if (m === 1 && d === 7) return 'Рождество Христово';
    if (m === 1 && d <= 8) return 'Новогодние каникулы';
    if (m === 2 && d === 23) return 'День защитника Отечества';
    if (m === 3 && d === 8) return 'Международный женский день';
    if (m === 5 && d === 1) return 'Праздник Весны и Труда';
    if (m === 5 && d === 9) return 'День Победы';
    if (m === 6 && d === 12) return 'День России';
    if (m === 11 && d === 4) return 'День народного единства';
    return '';
  }
  function dayKind(k) {
    if (holidayName(k)) return 'hol';
    const w = parseKey(k).getDay();
    return (w === 5 || w === 6) ? 'off' : w === 0 ? 'sun' : 'work';
  }

  /* Отметка дня: { t: id смены или null, c: свой цвет или null, from и to: своё время или нет }. Старые записи были просто id смены. */
  const isTime = v => typeof v === 'string' && /^\d\d:\d\d$/.test(v);
  const packMark = v => {
    const out = { t: v.t || null, c: v.c ? col(v.c) : null };
    if (isTime(v.from)) out.from = v.from;
    if (isTime(v.to)) out.to = v.to;
    return out;
  };
  const norm = v => typeof v === 'string' ? { t: v, c: null } : (v && typeof v === 'object' && (v.t || v.c)) ? packMark(v) : null;
  /* Время работы: смена через полночь считается до следующего дня, одинаковое время означает сутки */
  const toMin = v => +v.slice(0, 2) * 60 + +v.slice(3, 5);
  const duration = (a, b) => (((toMin(b) - toMin(a) + 1440) % 1440) || 1440) / 60;
  const shortTime = v => { const h = +v.slice(0, 2), m = v.slice(3, 5); return m === '00' ? String(h) : h + ':' + m; };
  const fmtHours = x => String(Math.round(x * 100) / 100).replace('.', ',');
  const hoursWord = x => Number.isInteger(x) ? plural(x, 'час', 'часа', 'часов') : 'часа';

  /* Состояние */
  const LS_KEY = 'moi-smeny.v1';
  let state = { types: DEFAULT_TYPES.map(t => ({ ...t })), shifts: {}, notes: {} };
  let dirty = new Set();
  let cacheUid = null;
  function normShifts(src) {
    const out = {};
    for (const k in src) { const v = norm(src[k]); if (v) out[k] = v; }
    return out;
  }
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const c = JSON.parse(raw);
      if (c && c.state) {
        state = { types: c.state.types && c.state.types.length ? c.state.types : state.types, shifts: normShifts(c.state.shifts || {}), notes: c.state.notes || {} };
        dirty = new Set(c.dirty || []);
        cacheUid = c.uid || null;
      }
    }
  } catch (e) { /* без кэша страница работает так же */ }

  const now = new Date();
  let viewY = now.getFullYear(), viewM = now.getMonth();
  let selected = todayKey();
  let painting = false, armed = null, paintColor = null;
  let colorScope = 'day';
  let editingId = null;
  let search = '';
  let pickType = null;

  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ state, dirty: [...dirty], uid: cacheUid })); } catch (e) { /* кэш необязателен */ }
  }

  /* Хранилище аккаунта: личная ветка data/users/<id> */
  let coll = null;
  const inflight = new Set();
  const retries = {};
  let flushTimer = null;

  function setSync(kind) {
    const text = {
      local: 'Смены и заметки хранятся только на этом устройстве.',
      ok: 'Сохранено в вашем аккаунте. Смены и заметки видите только вы.',
      saving: 'Сохраняю…',
      slow: 'Нет связи с хранилищем. Изменения лежат в этом браузере и отправятся, когда связь появится.',
      err: 'Не удалось сохранить в аккаунт. Изменения остались в этом браузере.',
      full: 'Хранилище заполнено. Удалите старые заметки, чтобы новые сохранялись в аккаунт.'
    }[kind];
    const bad = kind === 'err' || kind === 'full' || kind === 'slow';
    $('sync').textContent = text;
    $('sync').classList.toggle('bad', bad);
    $('sync-bad').textContent = text;
    $('sync-bad').hidden = !bad;
  }
  function bodyOf(id) {
    if (id === 'settings') return { types: state.types };
    if (id.startsWith('m-')) {
      const ym = id.slice(2);
      const days = {};
      for (const k in state.shifts) if (k.startsWith(ym)) days[k.slice(8)] = state.shifts[k];
      return Object.keys(days).length ? { days } : null;
    }
    return state.notes[id] || null;
  }
  function mark(id) {
    dirty.add(id);
    saveLocal();
    if (coll) setSync('saving');
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flush, 500);
  }
  function flush() {
    if (!coll) return;
    for (const id of [...dirty]) {
      if (inflight.has(id)) continue;
      dirty.delete(id);
      inflight.add(id);
      const body = bodyOf(id);
      const ref = coll.doc(id);
      (body ? ref.set(JSON.parse(JSON.stringify(body))) : ref.delete()).then(() => {
        delete retries[id];
      }).catch(err => {
        dirty.add(id);
        const code = err && err.code;
        if (code === 'quota_exceeded') { setSync('full'); return; }
        retries[id] = (retries[id] || 0) + 1;
        if (code === 'invalid_argument' || code === 'revoked' || retries[id] > 3) { setSync('err'); return; }
        clearTimeout(flushTimer);
        flushTimer = setTimeout(flush, 2000 + Math.random() * 3000);
      }).finally(() => {
        inflight.delete(id);
        saveLocal();

    const notes = authoritative ? {} : { ...state.notes };
    const shifts = authoritative ? {} : { ...state.shifts };
    let types = state.types;
    snap.docs.forEach(doc => {
      const id = doc.id, data = doc.data();
      if (!data) return;
      if (id === 'settings') {
        if (!busy(id) && Array.isArray(data.types) && data.types.length) types = data.types.map(t => ({ ...t }));
      } else if (id.startsWith('m-')) {
        if (busy(id)) return;
        const ym = id.slice(2);
        if (!authoritative) for (const k in shifts) if (k.startsWith(ym)) delete shifts[k];
        const days = data.days || {};

    cacheUid = uid;
    coll = database.collection('data/users/' + uid);
    setSync('saving');
    const timer = setTimeout(() => setSync('slow'), 10000);
    coll.onSnapshot(snap => {
      if (!snap.metadata.fromCache) { clearTimeout(timer); if (!dirty.size && !inflight.size) setSync('ok'); }

  /* Заметки */
  const ALLOWED = new Set(['DIV', 'P', 'BR', 'B', 'STRONG', 'I', 'EM', 'U', 'UL', 'OL', 'LI']);
  function sanitize(html) {
    const tpl = document.createElement('template');
    tpl.innerHTML = html || '';
    (function walk(node) {
      [...node.childNodes].forEach(ch => {
        if (ch.nodeType === 3) return;
        if (ch.nodeType !== 1 || !ALLOWED.has(ch.tagName)) {
          if (ch.nodeType === 1 && ch.tagName !== 'SCRIPT' && ch.tagName !== 'STYLE') {
            walk(ch);
            while (ch.firstChild) node.insertBefore(ch.firstChild, ch);
          }
          ch.remove();
          return;
        }
        const isCheck = ch.tagName === 'DIV' && ch.classList.contains('check');
        const done = ch.getAttribute('data-done');
        [...ch.attributes].forEach(a => ch.removeAttribute(a.name));
        if (isCheck) { ch.className = 'check'; if (done === '1') ch.setAttribute('data-done', '1'); }
        walk(ch);
      });
    })(tpl.content);
    const box = document.createElement('div');
    box.appendChild(tpl.content);
    return box.innerHTML;
  }
  function noteLines(html) {

    tpl.content.childNodes.forEach(n => {

  }
  function noteRow(n) {

    return '<button type="button" class="note-row" data-note="' + esc(n.id) + '">' +
      (n.color ? '<span class="ndot c' + col(n.color) + '"></span>' : '') +

      '<span class="m"><time>' + esc(stampShort(n.updated)) + '</time><span>' + esc(lines[1] || 'Нет текста') + '</span></span>' +
      (n.date ? '<span class="to">К дню: ' + esc(dayTitle(n.date)) + '</span>' : '') +

  function renderNotes() {

    if (show === !el.hidden) return;
    el.hidden = false;
    const h = el.scrollHeight;
    const shut = { height: '0px', opacity: 0, paddingTop: '0px', paddingBottom: '0px' };
    const full = { height: h + 'px', opacity: 1, paddingTop: '6px', paddingBottom: '8px' };
    el.style.overflow = 'hidden';
    const a = el.animate(show ? [shut, full] : [full, shut], { duration: show ? 280 : 200, easing: EASE });
    el._slide = a;
    const done = () => { if (el._slide !== a) return; el._slide = null; el.style.overflow = ''; if (!show) el.hidden = true; };
    a.onfinish = done;
    if (show) staggerIn(el.querySelectorAll('.sw, input, .btn'), 6);

  function topBlocks() {
    const sel = getSelection();

    const r = sel.getRangeAt(0);
    const top = n => {
      if (n === editor) n = editor.childNodes[Math.min(r.startOffset, editor.childNodes.length - 1)];
      while (n && n.parentNode !== editor) n = n.parentNode;
      return n;
    };
    const a = top(r.startContainer), b = top(r.endContainer);
    const out = [];
    let cur = a;
    while (cur) { out.push(cur); if (cur === b) break; cur = cur.nextSibling; }
    return out.map(n => {
      if (n.nodeType === 3 || ['BR', 'B', 'I', 'U', 'STRONG', 'EM'].includes(n.nodeName)) {

    $('ts-' + t.id).innerHTML = typeSum(t);
    mark('settings');
    renderGrid(); renderNext(); renderPaint(); renderTotals(); renderDaySheet();
  };
  $('type-rows').addEventListener('input', onTypeInput);
  $('type-rows').addEventListener('change', onTypeInput);
  $('type-rows').addEventListener('click', e => {
    const pick = e.target.closest('[data-pick]');
    if (pick) {
      pickType = pickType === pick.dataset.pick ? null : pick.dataset.pick;
      renderTypeRows();
      staggerIn($('type-rows').querySelectorAll('.sw'), 6);
      return;
    }
    const c = e.target.closest('[data-color]');
    if (c) {
      const t = typeById(e.target.closest('[data-type]').dataset.type);
      t.color = +c.dataset.color;
      mark('settings');
      renderTypeRows(); renderGrid(); renderPaint(); renderDaySheet();
      return;
    }
    const b = e.target.closest('[data-del]');
    if (!b) return;
    state.types = state.types.filter(t => t.id !== b.dataset.del);
    if (armed === b.dataset.del) armed = state.types[0] ? state.types[0].id : null;
    mark('settings');
    renderTypeRows(); renderAll();
  });
  $('t-add').addEventListener('click', addType);
  $('t-close').addEventListener('click', () => {
    state.types.forEach(t => { t.code = (t.code || '').trim() || '•'; t.name = (t.name || '').trim() || 'Смена'; });
    mark('settings');
    closeSheet($('dlg-types'));
    renderAll();
  });

  /* Шторки: выезд снизу, закрытие вниз, смахивание пальцем */
  function openSheet(d) {
    if (d.open) return;
    d.style.transform = ''; d.style.animation = '';
    d.showModal();
    d.scrollTop = 0;
    if (d.id === 'dlg-day') renderDaySheet();
    staggerIn(d.querySelector('.dlg').children);
  }
  function closeSheet(d, fromY) {
    if (!d.open) return;
    if (REDUCE.matches || !document.body.animate) { d.close(); d.style.transform = ''; d.style.animation = ''; return; }
    const ghost = document.createElement('div');
    ghost.className = 'sheet-ghost';
    ghost.setAttribute('aria-hidden', 'true');
    ghost.innerHTML = d.innerHTML;
    ghost.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
    ghost.style.height = d.offsetHeight + 'px';
    const shade = document.createElement('div');
    shade.className = 'sheet-shade';
    const scroll = d.scrollTop;
    d.close();
    d.style.transform = ''; d.style.animation = '';
    /* Если под этой шторкой открыта другая, тень и копия должны лечь поверх неё */
    const host = [...document.querySelectorAll('dialog[open]')].pop() || document.body;
    host.append(shade, ghost);
    ghost.scrollTop = scroll;
    const a = ghost.animate([{ transform: 'translateY(' + (fromY || 0) + 'px)' }, { transform: 'translateY(105%)' }], { duration: 250, easing: 'cubic-bezier(.4, 0, .9, .6)', fill: 'forwards' });
    shade.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: 'forwards' });
    a.onfinish = () => { ghost.remove(); shade.remove(); };
  }
  document.querySelectorAll('dialog').forEach(d => {
    d.addEventListener('click', e => { if (e.target === d) closeSheet(d); });
    d.addEventListener('cancel', e => { e.preventDefault(); closeSheet(d); });
    let y0 = null, dy = 0, t0 = 0, dragging = false;
    d.addEventListener('touchstart', e => {
      y0 = (d.scrollTop > 0 || e.target.closest('input, select')) ? null : e.touches[0].clientY;
      dy = 0; dragging = false; t0 = e.timeStamp;
    }, { passive: true });
    d.addEventListener('touchmove', e => {
      if (y0 === null) return;
      const y = e.touches[0].clientY - y0;
      if (!dragging && y < 8) { if (y < -3) y0 = null; return; }
      dragging = true;
      dy = Math.max(0, y);
      d.style.animation = 'none';
      d.style.transform = 'translateY(' + dy + 'px)';
      e.preventDefault();
    }, { passive: false });
    const release = e => {
      if (!dragging) return;
      dragging = false; y0 = null;
      if (dy > 110 || dy / Math.max(1, e.timeStamp - t0) > .7) { closeSheet(d, dy); return; }
      d.style.transform = '';
      anim(d, [{ transform: 'translateY(' + dy + 'px)' }, { transform: 'none' }], { duration: 260, easing: EASE });
    };
    d.addEventListener('touchend', release);
    d.addEventListener('touchcancel', release);
  });

  /* Каждая кнопка отзывается на нажатие. Многие списки перерисовываются по клику, поэтому новую кнопку находим по её признаку. */
  function pressKey(b) {
    if (b.id) return '#' + b.id;
    const attr = ['date', 'set', 'color', 'arm', 'nav', 'pattern', 'scope', 'pick', 'note', 'cmd'].find(n => b.dataset[n] !== undefined);
    if (!attr) return null;
    const box = b.parentElement && b.parentElement.closest('[id]');
    return (box ? '#' + box.id + ' ' : '') + '[data-' + attr + '="' + b.dataset[attr] + '"]';
  }
  let pressed = null, pressedKey = null;
  document.addEventListener('touchstart', () => {}, { passive: true }); /* без этого iPhone не показывает нажатое состояние */
  document.addEventListener('click', e => {
    pressed = e.target.closest ? e.target.closest('button') : null;
    pressedKey = pressed ? pressKey(pressed) : null;
  }, true);
  document.addEventListener('click', () => {
    if (!pressed) return;
    let el = pressed;
    if (!el.isConnected && pressedKey) el = document.querySelector(pressedKey);
    pressed = null;
    if (!el) return;
    pop(el, el.matches('.cell') ? .94 : .88);
    if (el.matches('.cell')) {
      const fill = el.querySelector('.fill');
      if (fill) anim(fill, [{ transform: 'scale(.4)', opacity: .3 }, { transform: 'scale(1)', opacity: 1 }], { duration: 280, easing: EASE });
    }
    if (el.matches('.opt, .chip')) pop(el.querySelector('.code'), .4);
    if (el.matches('.sw')) pop(el.querySelector('svg'), .3);
  });

  /* Сообщение с отменой */
  let toastTimer = null;
  function toast(text, undo) {
    const el = $('toast');
    el.innerHTML = '<span>' + esc(text) + '</span>' + (undo ? '<button type="button" id="toast-undo">Отменить</button>' : '');
    el.hidden = false;
    anim(el, [{ opacity: 0, transform: 'translateY(24px) scale(.96)' }, { opacity: 1, transform: 'none' }], { duration: 300, easing: EASE });
    const hide = () => {
      clearTimeout(toastTimer);
      const a = anim(el, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(24px)' }], { duration: 200, easing: 'ease-in', fill: 'forwards' });
      if (!a) { el.hidden = true; return; }
      a.onfinish = () => { a.cancel(); el.hidden = true; };
    };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hide, 7000);
    if (undo) $('toast-undo').addEventListener('click', () => { undo(); hide(); });
  }

  renderAll();
  connect();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
